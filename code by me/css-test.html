<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Code Master Test — What Does This Line Do?</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --accent: #f43f5e;
      --accent-hover: #fb7185;
      --code-bg: #030712;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #141b2d 0%, #090d16 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    /* Header */
    .test-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }

    .test-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }

    .test-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Score Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .status-item span.highlight {
      color: var(--accent);
      font-weight: 700;
    }

    /* Question Card */
    .q-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .q-number {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .q-concept {
      font-size: 11px;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      color: #cbd5e1;
    }

    .q-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    /* Code Snippet Box */
    .code-box {
      background: var(--code-bg);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .code-line {
      display: block;
      white-space: pre;
    }

    .code-line.target-line {
      background: rgba(244, 63, 94, 0.15);
      color: #fca5a5;
      font-weight: 700;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
      margin-left: -8px;
      border-radius: 0 4px 4px 0;
    }

    .line-indicator {
      display: inline-block;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    /* Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      background: #141f36;
      border: 1px solid #1e293b;
      color: #e2e8f0;
      text-align: left;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #1e2e4f;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .option-letter {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      color: #94a3b8;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: var(--success) !important;
      color: #6ee7b7 !important;
    }

    .option-btn.correct .option-letter {
      background: var(--success);
      color: #022c22;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--error) !important;
      color: #fca5a5 !important;
    }

    .option-btn.wrong .option-letter {
      background: var(--error);
      color: #fff;
    }

    /* Explanation Banner */
    .explanation {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #0b1329;
      border-left: 4px solid #38bdf8;
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      display: none;
    }

    .explanation strong {
      color: #38bdf8;
      display: block;
      margin-bottom: 4px;
    }

    /* Footer & Reset */
    .test-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .reset-btn, .link-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .reset-btn:hover, .link-btn:hover {
      background: #334155;
    }

    .accent-btn {
      background: var(--accent);
      border-color: var(--accent);
    }
    .accent-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="test-header">
      <span class="badge">NextSem Interactive Student Quiz</span>
      <h1>CSS Line-by-Line Comprehension Test</h1>
      <p>Test student understanding of each exact CSS property & selector from this project's code (Heart Like Animation).</p>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-item">Total Questions: <span class="highlight">10</span></div>
      <div class="status-item">Answered: <span id="answered-count" class="highlight">0</span>/10</div>
      <div class="status-item">Score: <span id="score-count" class="highlight">0</span> / 10</div>
    </div>

    <!-- Questions Container -->
    <div id="questions-wrapper"></div>

    <!-- Footer Controls -->
    <div class="test-footer">
      <a href="./index.html" class="link-btn">← Back to Heart Demo</a>
      <button class="reset-btn accent-btn" onclick="resetQuiz()">↺ Restart Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        concept: "Box Sizing Reset",
        title: "Look at the highlighted line below. What is the exact work / purpose of this line?",
        codeSnippet: `* {
  box-sizing: border-box;  /* <-- THIS LINE */
  margin: 0;
  padding: 0;
}`,
        targetLine: "  box-sizing: border-box;",
        options: [
          { text: "It includes padding and border in the element's total width and height calculation so dimensions don't expand unexpectedly.", correct: true },
          { text: "It adds a 1px border around every single element on the page.", correct: false },
          { text: "It hides the borders completely for all boxes.", correct: false },
          { text: "It forces all elements to behave as flex containers.", correct: false }
        ],
        explanation: "box-sizing: border-box tells the browser that width and height include content, padding, and border. Without it (content-box), adding 10px padding makes a 100px element grow to 120px wide."
      },
      {
        id: 2,
        concept: "Centered Layout",
        title: "In the body rule, what does this specific line accomplish?",
        codeSnippet: `body {
  min-height: 100vh;  /* <-- THIS LINE */
  display: flex;
  align-items: center;
  justify-content: center;
}`,
        targetLine: "  min-height: 100vh;",
        options: [
          { text: "It restricts the viewport height to exactly 100 pixels on mobile.", correct: false },
          { text: "It ensures the body covers at least 100% of the viewport height so flexbox can vertically center the card.", correct: true },
          { text: "It sets the scrolling speed to 100 frames per second.", correct: false },
          { text: "It hides any content that overflows past the initial screen view.", correct: false }
        ],
        explanation: "min-height: 100vh forces the body container to expand to at least 100% of the viewport height, which allows align-items: center to place the card in the vertical middle."
      },
      {
        id: 3,
        concept: "Hidden Checkbox Trigger",
        title: "In pure CSS interactive components, what is the work of this line?",
        codeSnippet: `.like-checkbox {
  position: absolute;
  opacity: 0;
  pointer-events: none;  /* <-- THIS LINE */
}`,
        targetLine: "  pointer-events: none;",
        options: [
          { text: "It disables the button so it can never be clicked.", correct: false },
          { text: "It prevents mouse cursor/touch interactions directly on the raw checkbox, letting clicks pass through to the enclosing <label>.", correct: true },
          { text: "It changes the mouse pointer into an arrow icon.", correct: false },
          { text: "It stops JavaScript event listeners from executing.", correct: false }
        ],
        explanation: "pointer-events: none ensures clicks go straight to the parent <label for='like-toggle'>, eliminating ghost clicks or misaligned hitboxes on the invisible checkbox input."
      },
      {
        id: 4,
        concept: "Sibling Selector Mechanism",
        title: "Look at the selector. What is the function of the '~' symbol here?",
        codeSnippet: `.like-checkbox:checked ~ .heart-icon {  /* <-- THIS SELECTOR */
  fill: #f43f5e;
  stroke: #f43f5e;
}`,
        targetLine: ".like-checkbox:checked ~ .heart-icon {",
        options: [
          { text: "It selects only the direct child element inside the checkbox.", correct: false },
          { text: "General Sibling Combinator: targets .heart-icon when it is preceded by a checked .like-checkbox inside the same parent container.", correct: true },
          { text: "It creates a smooth CSS transition between the checkbox and heart.", correct: false },
          { text: "It negates the selection (selects everything except .heart-icon).", correct: false }
        ],
        explanation: "The tilde (~) is the General Sibling Combinator. When the invisible checkbox is checked, it triggers styles on subsequent sibling elements (.heart-icon, .ring, .particle) without writing any JavaScript!"
      },
      {
        id: 5,
        concept: "Z-Index Stacking",
        title: "Why is this line specified on .heart-icon?",
        codeSnippet: `.heart-icon {
  width: 32px;
  height: 32px;
  z-index: 2;  /* <-- THIS LINE */
}`,
        targetLine: "  z-index: 2;",
        options: [
          { text: "It multiplies the scale of the icon by 2x.", correct: false },
          { text: "It places the heart icon visually on top of the expanding background ring (z-index: 1) so the ripple stays behind the heart.", correct: true },
          { text: "It repeats the heart icon 2 times.", correct: false },
          { text: "It sets 2 layers of stroke outlines.", correct: false }
        ],
        explanation: "z-index: 2 raises .heart-icon above .ring (which has z-index: 1), ensuring the pink ripple ring expands behind the heart rather than obscuring it."
      },
      {
        id: 6,
        concept: "Transform Centering",
        title: "What does this line do to the absolute-positioned .ring element?",
        codeSnippet: `.ring {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);  /* <-- THIS LINE */
}`,
        targetLine: "  transform: translate(-50%, -50%) scale(0);",
        options: [
          { text: "It shifts the ring by half its own width and height to perfectly center it on (28px, 50%) and shrinks its initial size to zero.", correct: true },
          { text: "It rotates the element 50 degrees counter-clockwise.", correct: false },
          { text: "It moves the element 50px outside of the card boundary.", correct: false },
          { text: "It crops the element into a 50% circle.", correct: false }
        ],
        explanation: "translate(-50%, -50%) offsets the element by 50% of its own dimensions, centering its origin right on the coordinates, while scale(0) keeps it invisible until the burst animation plays."
      },
      {
        id: 7,
        concept: "Custom Properties (CSS Variables)",
        title: "What is the purpose of declaring '--tx' and '--ty' on each particle?",
        codeSnippet: `.p1 { background: #f43f5e; --tx: 0px;   --ty: -30px; }  /* <-- THIS LINE */
.p2 { background: #fb7185; --tx: 24px;  --ty: -18px; }`,
        targetLine: ".p1 { background: #f43f5e; --tx: 0px;   --ty: -30px; }",
        options: [
          { text: "They define unique target X and Y explosion coordinates for each individual particle used inside the shared @keyframes animation.", correct: true },
          { text: "They are built-in CSS tags that turn elements into 3D objects.", correct: false },
          { text: "They set text alignment to top and center.", correct: false },
          { text: "They set transition delay timers for the particles.", correct: false }
        ],
        explanation: "--tx and --ty are CSS custom properties (variables). They allow all 6 particles to share one single @keyframes particleBurst animation while flying outwards in distinct directions via calc(-50% + var(--tx))."
      },
      {
        id: 8,
        concept: "Animation Fill Mode",
        title: "In the animation shorthand below, what does the word 'forwards' do?",
        codeSnippet: `.like-checkbox:checked ~ .heart-icon {
  animation: heartPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;  /* <-- 'forwards' */
}`,
        targetLine: "  animation: heartPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;",
        options: [
          { text: "It causes the animation to replay infinitely from start to finish.", correct: false },
          { text: "It retains the computed styles of the final keyframe (100%) after the animation finishes instead of snapping back to 0%.", correct: true },
          { text: "It speeds up the animation direction towards the front of the screen.", correct: false },
          { text: "It plays the keyframes in forward order rather than backwards order only.", correct: false }
        ],
        explanation: "animation-fill-mode: forwards ensures that when heartPop finishes, the element retains the property values set by the 100% keyframe rather than reverting to its pre-animation state."
      },
      {
        id: 9,
        concept: "Cubic-Bezier Easing",
        title: "Why did we use 'cubic-bezier(0.175, 0.885, 0.32, 1.4)' instead of 'ease' or 'linear'?",
        codeSnippet: `animation: heartPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;`,
        targetLine: "cubic-bezier(0.175, 0.885, 0.32, 1.4)",
        options: [
          { text: "Because the Y coordinate exceeds 1.0 (1.4), creating an elastic overshoot / bouncy pop effect on the heart.", correct: true },
          { text: "Because cubic-bezier uses less CPU and battery than ease.", correct: false },
          { text: "Because it makes the heart turn 3-dimensional.", correct: false },
          { text: "Because standard CSS transitions do not support linear timing.", correct: false }
        ],
        explanation: "In cubic-bezier(x1, y1, x2, y2), when y2 > 1.0, the value overshoots the target value before snapping back, producing an energetic, springy bounce feel."
      },
      {
        id: 10,
        concept: "SVG Icon Styling",
        title: "What is the purpose of 'fill: transparent' on the unliked heart icon?",
        codeSnippet: `.heart-icon {
  width: 32px;
  height: 32px;
  fill: transparent;  /* <-- THIS LINE */
  stroke: #64748b;
  stroke-width: 2;
}`,
        targetLine: "  fill: transparent;",
        options: [
          { text: "It leaves the heart outline hollow so only the 2px stroke is visible until clicked.", correct: true },
          { text: "It deletes the SVG path from the DOM tree.", correct: false },
          { text: "It makes the heart completely invisible on the screen.", correct: false },
          { text: "It applies a glass blur transparency filter over the heart.", correct: false }
        ],
        explanation: "SVG paths use fill to color their interior and stroke for their border. fill: transparent creates an outline-only heart icon; when liked, fill changes to #f43f5e to fill it solid."
      }
    ];

    let userAnswers = {};

    function renderQuestions() {
      const container = document.getElementById('questions-wrapper');
      container.innerHTML = '';

      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = `card-q-${q.id}`;

        const linesHtml = q.codeSnippet.split('\n').map(line => {
          const isTarget = line.includes('THIS LINE') || line.includes('THIS SELECTOR') || line.includes('cubic-bezier');
          return `<span class="code-line ${isTarget ? 'target-line' : ''}">${escapeHtml(line)}</span>`;
        }).join('');

        let optionsHtml = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, optIdx) => {
          optionsHtml += `
            <button class="option-btn" id="btn-${q.id}-${optIdx}" onclick="selectAnswer(${q.id}, ${optIdx})">
              <span class="option-letter">${letters[optIdx]}</span>
              <span>${escapeHtml(opt.text)}</span>
            </button>
          `;
        });

        card.innerHTML = `
          <div class="q-meta">
            <span class="q-number">Question ${idx + 1} of ${questions.length}</span>
            <span class="q-concept">${q.concept}</span>
          </div>
          <div class="q-title">${q.title}</div>
          <div class="line-indicator">Target CSS Code:</div>
          <div class="code-box">${linesHtml}</div>
          <div class="options-grid">${optionsHtml}</div>
          <div class="explanation" id="exp-${q.id}">
            <strong>💡 Explanation & Mechanics:</strong>
            ${escapeHtml(q.explanation)}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function selectAnswer(qId, selectedIdx) {
      if (userAnswers[qId] !== undefined) return; // already answered

      userAnswers[qId] = selectedIdx;
      const q = questions.find(item => item.id === qId);
      const isCorrect = q.options[selectedIdx].correct;

      // Disable buttons and style them
      q.options.forEach((opt, optIdx) => {
        const btn = document.getElementById(`btn-${qId}-${optIdx}`);
        btn.disabled = true;
        if (opt.correct) {
          btn.classList.add('correct');
        } else if (optIdx === selectedIdx && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      // Show explanation
      const exp = document.getElementById(`exp-${qId}`);
      exp.style.display = 'block';

      updateStats();
    }

    function updateStats() {
      const answered = Object.keys(userAnswers).length;
      let score = 0;

      for (let qId in userAnswers) {
        const q = questions.find(item => item.id == qId);
        if (q.options[userAnswers[qId]].correct) {
          score++;
        }
      }

      document.getElementById('answered-count').textContent = answered;
      document.getElementById('score-count').textContent = score;
    }

    function resetQuiz() {
      userAnswers = {};
      renderQuestions();
      updateStats();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Initialize on load
    renderQuestions();
  </script>
</body>
</html>
