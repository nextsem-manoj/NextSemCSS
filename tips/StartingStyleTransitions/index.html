<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS @starting-style Entry Transition</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="demo-box">
    <button class="trigger-btn" onclick="togglePopover()">Toggle Toast with @starting-style</button>
    <div class="toast" id="myToast">
      🎉 Modern CSS @starting-style allows smooth entrance animations from display:none!
    </div>
  </div>

  <script>
    function togglePopover() {
      const toast = document.getElementById('myToast');
      toast.classList.toggle('open');
    }
  </script>
</body>
</html>
