<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid Modern Layout</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bento-container">
    <div class="bento-item featured">
      <span class="tag">Flagship</span>
      <h3>AI Design Engine</h3>
      <p>Generative layouts, automated palettes, and instantaneous code export.</p>
    </div>
    <div class="bento-item stat-item">
      <div class="num">99.9%</div>
      <div class="lbl">Uptime SLA</div>
    </div>
    <div class="bento-item stat-item">
      <div class="num">107+</div>
      <div class="lbl">CSS Components</div>
    </div>
  </div>
</body>
</html>
