<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern CSS color-mix() in OKLCH</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="swatches-container">
    <div class="swatch s-base">Base (#38bdf8)</div>
    <div class="swatch s-25">color-mix 25%</div>
    <div class="swatch s-50">color-mix 50%</div>
    <div class="swatch s-75">color-mix 75%</div>
    <div class="swatch s-target">Target (#ec4899)</div>
  </div>
</body>
</html>
