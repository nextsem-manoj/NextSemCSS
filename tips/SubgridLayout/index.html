<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Subgrid Alignment</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="parent-grid">
    <div class="card subgrid-card">
      <h3>Title 1 (Short)</h3>
      <p>A quick summary sentence that takes little space.</p>
      <button>Action</button>
    </div>

    <div class="card subgrid-card">
      <h3>Title 2 (Much Longer Multiline Heading to Demonstrate Subgrid Alignment)</h3>
      <p>This paragraph contains multiple sentences with detailed explanation. Notice how all buttons align on the same line!</p>
      <button>Action</button>
    </div>
  </div>
</body>
</html>
