<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container Queries Responsive Card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="resize-wrapper">
    <div class="card-container">
      <div class="card">
        <div class="card-media">🎨</div>
        <div class="card-content">
          <span class="badge">Modern CSS</span>
          <h3>Container Queries</h3>
          <p>This card adapts its layout based on its container's width, not the viewport! Resize the wrapper to see the transformation.</p>
          <button class="btn">Explore Now</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
