<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skills & Tips Studio | 107+ Interactive Tips by NextSem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090d16;
      --bg-surface: #0f1626;
      --bg-card: #151f34;
      --bg-hover: #1c2a47;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #38bdf8;
      
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
    }

    .stats-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* Main Studio Layout */
    .studio-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      height: calc(100vh - 58px);
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .search-box-wrap {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .categories-bar {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .cat-pill:hover, .cat-pill.active {
      background: var(--accent-cyan);
      color: #090d16;
      border-color: var(--accent-cyan);
    }

    .tips-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .tip-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .tip-item:hover {
      background: var(--bg-hover);
    }

    .tip-item.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .tip-item-name {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tip-item.active .tip-item-name {
      color: var(--accent-cyan);
    }

    .tip-item-cat {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    /* Workspace Panel */
    main {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--bg-base);
    }

    .workspace-header {
      padding: 12px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .workspace-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .workspace-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .workspace-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-cyan);
    }

    /* Split Workspace View */
    .workspace-split {
      flex: 1;
      display: grid;
      grid-template-rows: 55% 45%;
      overflow: hidden;
    }

    .preview-box {
      background: #000;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* Code Inspector */
    .code-inspector {
      background: #040711;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-tabs {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 38px;
      flex-shrink: 0;
    }

    .tabs-group {
      display: flex;
      gap: 4px;
    }

    .code-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .code-tab.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: var(--accent-emerald);
      color: #000;
      border-color: var(--accent-emerald);
    }

    .code-display {
      flex: 1;
      overflow: auto;
      padding: 16px;
      font-family: var(--font-code);
      font-size: 0.82rem;
      line-height: 1.6;
      color: #7dd3fc;
      white-space: pre;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-wrap">
      <div class="brand-logo">CSS</div>
      <div class="brand-title">CSS Skills &amp; Tips Studio</div>
      <span class="stats-badge" id="stats-badge">Loading...</span>
    </div>
    <div>
      <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Use ↑ / ↓ arrow keys to browse</span>
    </div>
  </header>

  <!-- Studio Container -->
  <div class="studio-container">

    <!-- Sidebar -->
    <aside>
      <div class="search-box-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Search 107 CSS tips (e.g. neon, flex, button)...">
      </div>
      <div class="categories-bar" id="categories-bar">
        <button class="cat-pill active" onclick="filterCategory('All')">All</button>
        <button class="cat-pill" onclick="filterCategory('Buttons & Hovers')">Buttons &amp; Hovers</button>
        <button class="cat-pill" onclick="filterCategory('Animations & Loaders')">Animations &amp; Loaders</button>
        <button class="cat-pill" onclick="filterCategory('Backgrounds & Gradients')">Backgrounds</button>
        <button class="cat-pill" onclick="filterCategory('Layout & Flexbox')">Layout &amp; Flexbox</button>
        <button class="cat-pill" onclick="filterCategory('Typography & Text')">Typography</button>
        <button class="cat-pill" onclick="filterCategory('Forms & Inputs')">Inputs &amp; Forms</button>
        <button class="cat-pill" onclick="filterCategory('Borders & Shadows')">Borders &amp; Shadows</button>
        <button class="cat-pill" onclick="filterCategory('Images & Media')">Images</button>
      </div>
      <div class="tips-list" id="tips-list">
        <!-- Dynamically rendered -->
      </div>
    </aside>

    <!-- Workspace -->
    <main>
      <div class="workspace-header">
        <div class="workspace-title-group">
          <h2 class="workspace-title" id="current-title">Select a CSS Tip</h2>
          <span class="stats-badge" id="current-category" style="display:none;"></span>
        </div>
        <div class="workspace-actions">
          <button class="action-btn" onclick="reloadPreview()">🔄 Refresh</button>
          <a class="action-btn" id="open-tab-btn" href="#" target="_blank">↗ Open Fullscreen</a>
        </div>
      </div>

      <div class="workspace-split">
        <!-- Preview Box -->
        <div class="preview-box">
          <iframe id="preview-iframe" class="preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <!-- Code Inspector -->
        <div class="code-inspector">
          <div class="code-tabs">
            <div class="tabs-group">
              <button class="code-tab active" id="tab-css" onclick="switchTab('css')">CSS (style.css)</button>
              <button class="code-tab" id="tab-html" onclick="switchTab('html')">HTML (index.html)</button>
            </div>
            <button class="copy-btn" id="copy-btn" onclick="copyCurrentCode()">📋 Copy Code</button>
          </div>
          <pre class="code-display" id="code-display">// Loading code...</pre>
        </div>
      </div>
    </main>

  </div>

  <script>
    let allTips = [];
    let filteredTips = [];
    let currentTipIndex = 0;
    let currentCodeTab = 'css';
    let activeCategory = 'All';

    async function init() {
      try {
        const res = await fetch('/api/tips');
        allTips = await res.json();
        filteredTips = [...allTips];

        document.getElementById('stats-badge').innerText = `${allTips.length} CSS Tips Active`;

        renderSidebar();
        if (allTips.length > 0) {
          selectTip(0);
        }
      } catch (err) {
        console.error('Failed to load tips:', err);
      }

      // Event listeners
      document.getElementById('search-input').addEventListener('input', (e) => {
        handleSearch(e.target.value);
      });

      // Keyboard arrow navigation
      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (currentTipIndex < filteredTips.length - 1) selectTip(currentTipIndex + 1);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (currentTipIndex > 0) selectTip(currentTipIndex - 1);
        }
      });
    }

    function renderSidebar() {
      const container = document.getElementById('tips-list');
      container.innerHTML = '';

      filteredTips.forEach((tip, idx) => {
        const item = document.createElement('div');
        item.className = `tip-item ${idx === currentTipIndex ? 'active' : ''}`;
        item.onclick = () => selectTip(idx);

        item.innerHTML = `
          <div>
            <div class="tip-item-name">${tip.name}</div>
            <div class="tip-item-cat">${tip.category}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectTip(idx) {
      if (!filteredTips[idx]) return;
      currentTipIndex = idx;
      const tip = filteredTips[idx];

      // Update active highlight in list
      document.querySelectorAll('.tip-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      // Update workspace header
      document.getElementById('current-title').innerText = tip.name;
      const catBadge = document.getElementById('current-category');
      catBadge.style.display = 'inline-block';
      catBadge.innerText = tip.category;

      document.getElementById('open-tab-btn').href = tip.path;

      // Update iframe
      document.getElementById('preview-iframe').src = tip.path;

      // Update Code display
      updateCodeDisplay();
    }

    function switchTab(tab) {
      currentCodeTab = tab;
      document.getElementById('tab-css').classList.toggle('active', tab === 'css');
      document.getElementById('tab-html').classList.toggle('active', tab === 'html');
      updateCodeDisplay();
    }

    function updateCodeDisplay() {
      const tip = filteredTips[currentTipIndex];
      if (!tip) return;
      const display = document.getElementById('code-display');
      display.innerText = (currentCodeTab === 'css') ? (tip.css || '/* No CSS */') : (tip.html || '<!-- No HTML -->');
    }

    function copyCurrentCode() {
      const tip = filteredTips[currentTipIndex];
      if (!tip) return;
      const code = (currentCodeTab === 'css') ? tip.css : tip.html;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.innerText = '✅ Copied!';
        setTimeout(() => { btn.innerText = '📋 Copy Code'; }, 1500);
      });
    }

    function reloadPreview() {
      const iframe = document.getElementById('preview-iframe');
      iframe.src = iframe.src;
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'All' && btn.innerText === 'All'));
      });
      applyFilters();
    }

    function handleSearch(query) {
      applyFilters(query);
    }

    function applyFilters(searchQuery = document.getElementById('search-input').value) {
      const q = searchQuery.toLowerCase().trim();
      filteredTips = allTips.filter(tip => {
        const matchesCategory = (activeCategory === 'All') || tip.category === activeCategory;
        const matchesSearch = !q || tip.name.toLowerCase().includes(q) || tip.id.toLowerCase().includes(q) || tip.category.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      renderSidebar();
      if (filteredTips.length > 0) {
        selectTip(0);
      } else {
        document.getElementById('current-title').innerText = 'No matching tips found';
        document.getElementById('current-category').style.display = 'none';
        document.getElementById('code-display').innerText = '';
      }
    }

    window.onload = init;
  </script>
</body>
</html>
